services:
  - type: web
    # 오리건에 있던 songsim-public-api 를 싱가포르로 옮기면서 새로 만든 서비스다.
    # Render 는 리전을 바꿀 수 없어서(PATCH 는 200 을 주지만 조용히 무시한다)
    # 같은 설정으로 다시 만드는 것 말고는 방법이 없었다.
    #
    # 데이터베이스는 Supabase 서울에 있는데 앱이 미국에서 돌고 있었다. 커넥션
    # 풀을 넣어 연결 수립 왕복을 없앤 뒤에도 질의 왕복이 남았고, 실측으로
    # /classrooms/empty 가 오리건 1.33~1.53초, 싱가포르 0.87~0.89초였다.
    name: songsim-api-sg
    region: singapore
    runtime: python
    plan: free
    buildFilter:
      paths:
        - src/**
        - data/**
        - docs/**
        - pyproject.toml
        - uv.lock
        - render.yaml
    buildCommand: pip install uv && uv sync --frozen --no-dev
    startCommand: bash -lc 'SONGSIM_APP_HOST=0.0.0.0 SONGSIM_APP_PORT=$PORT uv run --frozen songsim-api'
    healthCheckPath: /healthz
    envVars:
      - key: SONGSIM_DATABASE_URL
        sync: false
      - key: SONGSIM_KAKAO_REST_API_KEY
        sync: false
      - key: SONGSIM_PUBLIC_HTTP_URL
        sync: false
      - key: SONGSIM_PUBLIC_MCP_URL
        sync: false
      # 학생용 모바일 웹 주소. 설정하면 랜딩 페이지 맨 위에 학생용 배너가 뜬다.
      - key: SONGSIM_STUDENT_WEB_URL
        sync: false
      - key: SONGSIM_APP_MODE
        value: public_readonly
      - key: SONGSIM_SEED_DEMO_ON_START
        value: "false"
      - key: SONGSIM_SYNC_OFFICIAL_ON_START
        value: "false"
      - key: SONGSIM_AUTOMATION_ENABLED
        value: "false"
      - key: SONGSIM_AUTOMATION_TICK_SECONDS
        value: "60"
      - key: SONGSIM_AUTOMATION_SNAPSHOT_INTERVAL_MINUTES
        value: "360"
      - key: SONGSIM_AUTOMATION_CACHE_CLEANUP_INTERVAL_MINUTES
        value: "720"

  - type: web
    # API 와 같은 이유로 싱가포르로 옮겼다. 자세한 배경은 위 서비스 주석 참고.
    # 이 주소는 AI 클라이언트에 등록되는 값이라 바꾸면 이미 연결해 둔 쪽이
    # 끊긴다. 등록된 사용자가 없다는 확인을 받고 옮겼다.
    name: songsim-mcp-sg
    region: singapore
    runtime: python
    plan: free
    buildFilter:
      paths:
        - src/**
        - data/**
        - docs/**
        - pyproject.toml
        - uv.lock
        - render.yaml
    buildCommand: pip install uv && uv sync --frozen --no-dev --extra mcp
    startCommand: bash -lc 'SONGSIM_APP_HOST=0.0.0.0 SONGSIM_APP_PORT=$PORT uv run --frozen songsim-mcp --transport streamable-http'
    healthCheckPath: /healthz
    envVars:
      - key: SONGSIM_DATABASE_URL
        sync: false
      - key: SONGSIM_KAKAO_REST_API_KEY
        sync: false
      - key: SONGSIM_PUBLIC_HTTP_URL
        sync: false
      - key: SONGSIM_PUBLIC_MCP_URL
        sync: false
      - key: SONGSIM_APP_MODE
        value: public_readonly
      - key: SONGSIM_SEED_DEMO_ON_START
        value: "false"
      - key: SONGSIM_SYNC_OFFICIAL_ON_START
        value: "false"
      - key: SONGSIM_AUTOMATION_ENABLED
        value: "false"
