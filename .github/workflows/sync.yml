name: Sync official data

# 프로덕션은 SONGSIM_APP_MODE=public_readonly 라 스스로 공식 데이터를 갱신하지 않는다.
# 그 게이트는 의도된 것이고, 애초에 Render 무료 플랜은 15분이면 잠들어서
# 서버 안의 스케줄러가 돌 수도 없다. 그래서 갱신은 바깥에서 이 워크플로가 맡는다.
#
# 실패하면 Actions 탭에 빨간색으로 남는 것이 이 방식의 핵심이다.
# 학식은 주 단위, 공지는 매일 바뀌므로 조용히 멈추면 학생이 지난주 메뉴를 보게 된다.

on:
  schedule:
    # 6시간 간격 (UTC) → KST 09:00 / 15:00 / 21:00 / 03:00
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      year:
        description: "개설과목 조회 연도 (비우면 오늘 날짜로 계산)"
        required: false
        type: string
      semester:
        description: "학기 1 또는 2 (비우면 오늘 날짜로 계산)"
        required: false
        type: string
      notice_pages:
        description: "가져올 공지 목록 페이지 수"
        required: false
        default: "3"
        type: string

concurrency:
  # 앞선 실행이 아직 돌고 있으면 겹쳐 쓰지 않는다.
  group: sync-official-data
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    # 20분이었을 때 08-05 ~ 08-07 사이 8회 연속 잘렸다. 한 번은 13:00:15 에 시작해
    # 13:20:21 에 취소됐으니 정확히 timeout 이었다. 그래서 40분으로 물러났고
    # 그 뒤로는 16~26분에 끝났다.
    #
    # 오래 걸리는 이유는 학교 사이트로 소스를 하나씩 요청하기 때문이다. GitHub
    # 러너가 미국에 있어 왕복 지연이 누적된다(같은 작업이 국내 로컬에서는 2분).
    # 이제 places 를 건드리는 앞 네 단계만 순서를 지키고 나머지는 동시에 돈다.
    # 동시성은 SONGSIM_OFFICIAL_SYNC_CONCURRENCY 로 조절하며 기본값은 4다.
    #
    # timeout 은 아직 줄이지 않는다. 실제 러너에서 몇 분이 나오는지 몇 번 보고
    # 나서 줄인다. 벼랑에 다시 다가갈 이유가 없다.
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies from lockfile
        run: uv sync --frozen --extra dev --extra scrape

      - name: Resolve academic term
        id: term
        env:
          # 수동 실행 입력은 run: 에 직접 보간하지 않고 환경변수로만 넘긴다.
          INPUT_YEAR: ${{ inputs.year }}
          INPUT_SEMESTER: ${{ inputs.semester }}
          INPUT_NOTICE_PAGES: ${{ inputs.notice_pages }}
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import os
          from datetime import datetime, timedelta, timezone

          # 규칙은 services.py 의 _current_year_and_semester 를 따른다.
          # 여기에 다른 규칙을 적었다가 7~8월에 동기화는 1학기를 넣고 조회는 2학기를
          # 찾는 상태가 됐고, 그동안 빈 강의실이 항상 0개로 나왔다.
          #   7월 이후 = 2학기, 그 전 = 1학기
          now = datetime.now(timezone(timedelta(hours=9)))
          year, semester = now.year, 1 if now.month <= 6 else 2

          # 수동 실행 입력은 신뢰하지 않는다. 정수로 강제해서
          # GITHUB_OUTPUT 에 임의 문자열이 섞여 들어가지 못하게 한다.
          def _override(name, fallback, allowed=None):
              raw = (os.environ.get(name) or "").strip()
              if not raw:
                  return fallback
              value = int(raw)  # 숫자가 아니면 여기서 실패시킨다
              if allowed is not None and value not in allowed:
                  raise SystemExit(f"{name} must be one of {sorted(allowed)}")
              return value

          year = _override("INPUT_YEAR", year)
          semester = _override("INPUT_SEMESTER", semester, allowed={1, 2})
          notice_pages = _override("INPUT_NOTICE_PAGES", 3)
          if not 1 <= notice_pages <= 20:
              raise SystemExit("notice_pages must be between 1 and 20")

          print(f"year={year}")
          print(f"semester={semester}")
          print(f"notice_pages={notice_pages}")
          PY

      - name: Sync
        env:
          SONGSIM_DATABASE_URL: ${{ secrets.SONGSIM_DATABASE_URL }}
          # 공개 서비스와 무관한 별도 프로세스다. public_readonly 는 쓰기를 막는다.
          SONGSIM_APP_MODE: local_full
          SONGSIM_SEED_DEMO_ON_START: "false"
          SONGSIM_SYNC_OFFICIAL_ON_START: "false"
          # Kakao 키는 넣지 않는다. 공식 스냅샷 동기화는 주변 식당(Kakao Local)을
          # 건드리지 않으므로, 이 워크플로가 들고 있을 이유가 없다.
          # 앞 단계에서 정수로 검증된 값이지만, 셸에는 환경변수로만 넘긴다.
          TERM_YEAR: ${{ steps.term.outputs.year }}
          TERM_SEMESTER: ${{ steps.term.outputs.semester }}
          TERM_NOTICE_PAGES: ${{ steps.term.outputs.notice_pages }}
        run: |
          uv run songsim-sync \
            --year "$TERM_YEAR" \
            --semester "$TERM_SEMESTER" \
            --notice-pages "$TERM_NOTICE_PAGES"

      - name: Verify the service sees fresh data
        env:
          READYZ: https://songsim-api-sg.onrender.com/readyz
        run: |
          set -o pipefail

          # readiness 스냅샷은 30초 캐시된다.
          sleep 45

          # 이 서비스는 Render 무료 플랜이라 15분이면 잠든다. 잠든 인스턴스를
          # 깨우는 첫 요청은 실측 77초가 걸렸고, 그날그날 더 걸리기도 한다.
          # 예전에는 여기서 curl 한 번을 쏘고 그 출력을 python 으로 파이프했다.
          # 그러면 curl 이 타임아웃으로 죽어도 파이프의 종료 코드는 python 것이라
          # 실패가 JSONDecodeError 로 보고됐다. 서비스가 아직 안 깨어난 건지
          # 데이터가 낡은 건지를 로그만 봐서는 구분할 수 없었다.
          # 실패는 무엇이 실패했는지 말해야 한다.
          body=""
          for attempt in 1 2 3 4 5; do
            if body=$(curl -sS --max-time 120 --fail-with-body "$READYZ"); then
              break
            fi
            echo "attempt ${attempt}/5: readyz 응답 없음 (콜드 스타트 대기 중)"
            [ -n "$body" ] && printf '  본문: %.200s\n' "$body"
            body=""
            sleep 30
          done

          if [ -z "$body" ]; then
            echo "readyz 가 끝내 응답하지 않았다 — 서비스가 잠들어 있거나 죽었다."
            echo "동기화 자체는 앞 단계에서 성공했으므로 DB 는 갱신됐을 수 있다."
            exit 1
          fi

          printf '%s' "$body" | python -c "
          import json, sys
          data = json.load(sys.stdin)
          stale = [k for k, v in (data.get('tables') or {}).items() if not v.get('ok')]
          print('ok =', data.get('ok'))
          if stale:
              print('not ready:', ', '.join(stale))
              sys.exit(1)
          "
