name: CI

on:
  pull_request:
    paths:
      - "web/**"
      - "src/**"
      - "tests/**"
      - "data/**"
      - "docs/**"
      - "pyproject.toml"
      - "uv.lock"
      - "render.yaml"
      - ".github/workflows/ci.yml"
  push:
    branches: ["main"]
    paths:
      - "web/**"
      - "src/**"
      - "tests/**"
      - "data/**"
      - "docs/**"
      - "pyproject.toml"
      - "uv.lock"
      - "render.yaml"
      - ".github/workflows/ci.yml"

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npx playwright install --with-deps chromium webkit
      # Each run builds against isolated QA data, never production credentials or live data.
      - run: npm run test:e2e
      - run: npm run test:e2e
        env:
          TEST_MAP_KEY: qa-sdk-failure-test
      - run: npm run test:e2e -- --browser=webkit
        env:
          TEST_MAP_KEY: qa-sdk-failure-test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: web-browser-failures
          path: web/test-results/

  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies from lockfile
        run: uv sync --frozen --extra dev --extra mcp --extra scrape

      - name: Lint
        run: uv run ruff check .

  test:
    name: Test shard ${{ matrix.shard_index }}/4
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard_index: [0, 1, 2, 3]

    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: songsim
          POSTGRES_USER: songsim
          POSTGRES_PASSWORD: songsim
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U songsim -d songsim"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 30

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies from lockfile
        run: uv sync --frozen --extra dev --extra mcp --extra scrape

      - name: Select test shard
        run: |
          python - <<'PY' > /tmp/songsim-test-files.txt
          import os
          from pathlib import Path

          shard_index = int(os.environ["SONGSIM_TEST_SHARD_INDEX"])
          shard_total = int(os.environ["SONGSIM_TEST_SHARD_TOTAL"])
          files = sorted(str(path) for path in Path("tests").glob("test_*.py"))
          selected = files[shard_index::shard_total]
          if not selected:
              raise SystemExit("No tests selected for this shard.")
          print("\n".join(selected))
          PY
          echo "Selected test files:"
          cat /tmp/songsim-test-files.txt
        env:
          SONGSIM_TEST_SHARD_INDEX: ${{ matrix.shard_index }}
          SONGSIM_TEST_SHARD_TOTAL: 4

      - name: Test
        run: uv run pytest --durations=20 $(cat /tmp/songsim-test-files.txt)

  health:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [lint, test]

    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: songsim
          POSTGRES_USER: songsim
          POSTGRES_PASSWORD: songsim
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U songsim -d songsim"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 30

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies from lockfile
        run: uv sync --frozen --extra dev --extra mcp --extra scrape

      - name: API lightweight health
        run: |
          uv run python - <<'PY'
          from fastapi.testclient import TestClient
          from songsim_campus.api import create_app

          with TestClient(create_app()) as client:
              response = client.get("/healthz")
              assert response.status_code == 200
              assert response.json() == {"ok": True}
          PY

      - name: MCP lightweight health
        run: |
          uv run python - <<'PY'
          from fastapi.testclient import TestClient
          from songsim_campus.mcp_server import build_mcp

          app = build_mcp().streamable_http_app()
          with TestClient(app) as client:
              response = client.get("/healthz")
              assert response.status_code == 200
              assert response.json() == {"ok": True}
          PY
